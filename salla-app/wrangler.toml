name = "ibrand-sales-dashboard"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
# هذه المسارات تمر على الـ Worker أولاً، والباقي يُخدَّم كملفات ثابتة
run_worker_first = ["/api/*", "/webhook"]

# أنشئ الـ KV: npx wrangler kv namespace create TOKENS ثم ضع الـ id هنا
[[kv_namespaces]]
binding = "TOKENS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[d1_databases]]
binding = "DB"
database_name = "ibrand-sales"
# أنشئها: npx wrangler d1 create ibrand-sales ثم ضع الـ database_id هنا
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# مزامنة الخلفية كل دقيقة (تجلب الطلبات تدريجياً وتحفظ ملخصات يومية)
[triggers]
crons = ["* * * * *"]

[vars]
SALLA_API_BASE = "https://api.salla.dev/admin/v2"
SALLA_TOKEN_URL = "https://accounts.salla.sa/oauth2/token"
SALLA_INTROSPECT_URL = "https://api.salla.dev/exchange-authority/v1/introspect"
BACKFILL_DAYS = "400"
# عدد الأيام الأخيرة التي نحلّل فيها حملات الطلبات (طلب تفاصيل لكل طلب)
CAMPAIGN_DAYS = "90"
# 40 مناسبة للخطة المجانية (حد 50 نداءً خارجياً لكل تشغيل)، وارفعها إلى 900 في الخطة المدفوعة
SYNC_BUDGET = "40"
SALLA_APP_ID = "REPLACE_WITH_YOUR_APP_ID"

# الأسرار (لا تُكتب هنا): npx wrangler secret put SALLA_CLIENT_ID
#   SALLA_CLIENT_ID, SALLA_CLIENT_SECRET, SALLA_WEBHOOK_SECRET
